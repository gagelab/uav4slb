# =============================================================================
# DINOv2 ViT-S/14 — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with dinov2_cv0.yaml (ViT-B/14) so
# results can be meaningfully contrasted across architectures.
#
# Key ViT-S/14-specific choices
#   image_size  : 448  (= 14 × 32 patches — optimal for patch-14 backbone)
#                 Use 224 if GPU memory is tight (still divisible by 14).
#   backbone_lr : 5e-5 (10× lower than head; slightly higher than ViT-B/14
#                 because the smaller backbone is less prone to catastrophic
#                 forgetting of pretrained features)
#   head_lr     : 5e-4
#   batch_size  : 32  (448-px tiles; ViT-S is ~4× smaller than ViT-B, so we
#                 can afford double the batch size vs ViT-B/14 @ 518 px)
#   All other training hyperparameters kept identical to ViT-B/14 config for
#   a clean architectural comparison.
#
# Patch count comparison
#   ViT-S/14 @ 448×448 → 32×32 =  1 024 patches
#   ViT-B/14 @ 518×518 → 37×37 = 1 369 patches
# =============================================================================

experiment:
  name: "dinov2_vits14_cv0"
  description: "DINOv2 ViT-S/14 leave-one-year-out temporal generalization (CV0)"
  tags:
    - "dinov2"
    - "vits14"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  name: "dinov2_vits14"
  architecture: "dinov2_vits14"
  pretrained: true
  dropout_rate: 0.3
  freeze_backbone: false   # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # DINOv2 ViT-S/14 patch size is 14; 448 = 14×32 gives optimal resolution
  # without exceeding typical GPU memory at batch_size=32.
  # Drop to 224 = 14×16 to further halve VRAM usage.
  image_size: [448, 448]

  # Normalization — DINOv2 was trained with ImageNet statistics
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 32          # 448-px; ViT-S is lighter → room for larger batches
    batch_size_val: 64
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (identical to ViT-B/14 baseline for fair comparison)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision
  use_amp: true
  amp_dtype: "float16"      # Options: "float16" | "bfloat16"

  # Gradient clipping
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates — 10× ratio preserved from ViT-B/14 baseline.
  # Absolute LRs are slightly higher (5e-5 / 5e-4 vs 3e-5 / 3e-4) because the
  # smaller ViT-S backbone has lower risk of losing pretrained representations.
  optimizer:
    type: "AdamW"
    backbone_lr: 5.0e-5
    head_lr:     5.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (shared with ViT-B/14 — same splits, different model)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits"
  output_dir: "experiments/dinov2_vits14_cv0"
