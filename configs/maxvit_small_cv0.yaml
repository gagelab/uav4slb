# =============================================================================
# MaxViT-S — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with:
#   convnextv2_cv0.yaml    (ConvNeXt V2-B, ~88 M, pure CNN)
#   dinov2_cv0.yaml        (DINOv2 ViT-B/14, ~86 M, pure ViT)
#   dinov2_cv0_vits14.yaml (DINOv2 ViT-S/14, ~22 M, pure ViT)
#
# MaxViT-S occupies an interesting middle position in the model zoo — a
# hybrid CNN+Transformer that interleaves MBConv blocks, local window
# attention, and dilated grid attention in each stage.  Its inductive bias
# may be better suited to agricultural imagery than either pure ViTs
# (which require large pretraining datasets to learn local structure) or
# pure CNNs (which cannot model long-range plot-level disease gradients
# without very deep stacks).
#
# Key MaxViT-S-specific choices
#   architecture : maxvit_small_tf_224 (timm)
#                  ~69 M params; feature dim = 768; 4 hierarchical stages.
#   image_size   : 224  (native training resolution for the tf_224 variant;
#                  MaxViT window attention is fixed at 7×7 patches, so the
#                  input must be a multiple of the stem stride × window size.
#                  224 = 4 (stem stride) × 8 (windows of 7) × 7 (window size).
#                  Do NOT use arbitrary sizes without verifying window tiling.)
#   backbone_lr  : 2e-5 (conservative — hybrid attention layers are sensitive
#                  to large gradient updates after ImageNet pretraining)
#   head_lr      : 2e-4 (10× ratio maintained from ViT/ConvNeXt baselines)
#   batch_size   : 32   (224-px tiles at FP16 fits comfortably on 24 GB GPU)
#   weight_decay : 5e-2 (consistent with ConvNeXt V2 and ViT-B configs)
#
# Architecture comparison (all models in this study)
#   EfficientNet-V2-S  : ~21 M params, 384×384, supervised pretraining
#   DINOv2 ViT-S/14   : ~22 M params, 448×448, self-supervised pretraining
#   MaxViT-S           : ~69 M params, 224×224, supervised pretraining (IN-1k)
#   DINOv2 ViT-B/14   : ~86 M params, 518×518, self-supervised pretraining
#   ConvNeXt V2-B     : ~88 M params, 224×224, FCMAE self-supervised pretraining
#
# MaxViT-S is the hybrid CNN-Transformer baseline in the architectural
# comparison, positioned between the pure-CNN ConvNeXt V2-B and the
# pure-ViT DINOv2 models.
# =============================================================================

experiment:
  name: "maxvit_small_cv0"
  description: "MaxViT-S leave-one-year-out temporal generalization (CV0)"
  tags:
    - "maxvit"
    - "maxvit_small"
    - "hybrid"
    - "cnn_transformer"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  name: "maxvit_small"
  architecture: "maxvit_small_tf_224"
  pretrained: true                # Load ImageNet-1k weights via timm
  dropout_rate: 0.3
  freeze_backbone: false          # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # MaxViT-S tf_224 variant is trained at 224×224. The window attention grid
  # tiles require input dimensions divisible by 32 (stem stride 4 × 8 windows).
  # Do not change without verifying MaxViT's window partitioning constraints.
  image_size: [224, 224]

  # Normalization — MaxViT pretrained with ImageNet-1k statistics (via timm)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 32          # 224-px; fits 24 GB GPU at FP16 comfortably
    batch_size_val: 64
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (identical to ConvNeXt V2 / DINOv2 baselines for fair comparison)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision
  use_amp: true
  amp_dtype: "float16"      # Options: "float16" | "bfloat16"

  # Gradient clipping — MaxViT attention layers can produce large gradients
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates
  # MaxViT's hybrid attention requires conservative backbone LR to preserve
  # the interleaved local/global attention patterns from pretraining.
  # The 10× ratio between backbone and head is maintained across all baselines.
  optimizer:
    type: "AdamW"
    backbone_lr: 2.0e-5     # Conservative — same as ConvNeXt V2-B
    head_lr:     2.0e-4     # 10× backbone_lr; consistent across architectures
    weight_decay: 5.0e-2    # Consistent with ConvNeXt V2 and ViT-B/14
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (shared across all architectures — same folds)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits"
  output_dir: "experiments/maxvit_small_cv0"
