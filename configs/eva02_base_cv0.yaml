# =============================================================================
# EVA-02-B — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with all other architectures in this
# study, particularly the DINOv2 ViT-B/14 baseline, which shares the same
# macro-architecture but differs in pretraining objective and input resolution.
#
# For incremental retraining on expanded datasets (new field season), use
# configs/eva02_base_retrain.yaml with --warm-start.  Do not use this file
# with --warm-start; the learning rates here are calibrated for training
# from ImageNet weights, not from a domain-adapted checkpoint.
#
# EVA-02-B vs. DINOv2 ViT-B/14 — controlled comparison
# -------------------------------------------------------
#   Shared              : ViT-B backbone (~86 M), patch size 14, feature dim 768
#   Pretraining obj.    : EVA-02 = CLIP-guided MIM on merged-38M
#                         DINOv2 = self-distillation + iBOT MIM on curated-142M
#   Input resolution    : EVA-02 = 448px (32×32 = 1024 patches)
#                         DINOv2 = 518px (37×37 = 1369 patches)
#   Positional encoding : EVA-02 = RoPE (relative; interpolates cleanly)
#                         DINOv2 = learned absolute (interpolated at test time)
#
#   This comparison isolates pretraining data scale/objective and positional
#   encoding strategy while holding architecture size constant — the cleanest
#   head-to-head among all models in this study.
#
# Key EVA-02-B-specific choices
#   architecture : eva02_base_patch14_448.mim_in22k_ft_in22k_in1k (timm)
#                  ~86 M params; feature dim = 768; 448×448 input.
#   image_size   : 448  — native fine-tuning resolution for this timm variant.
#                  448 = 14 (patch size) × 32 patches per side.
#                  Use this exact size; RoPE generalises to other multiples of
#                  14 (196, 224, 280, 336, 392, 448, 490, ...) but 448 matches
#                  the pretrained fine-tuning checkpoint.
#   backbone_lr  : 2e-5 (conservative; same as DINOv2 ViT-B/14 for parity)
#   head_lr      : 2e-4 (10× ratio maintained throughout all baselines)
#   batch_size   : 16   (448-px tiles are larger than 224-px; 16 fits 24 GB GPU
#                  at FP16 — same reason DINOv2 ViT-B/14 uses a smaller batch)
#   weight_decay : 5e-2 (consistent with all other models in this study)
#
# Architecture comparison (all models in this study)
#   EfficientNet-V2-S  : ~21 M params, 384×384, supervised pretraining
#   DINOv2 ViT-S/14   : ~22 M params, 448×448, self-supervised pretraining
#   MaxViT-S           : ~69 M params, 224×224, supervised pretraining (IN-1k)
#   EVA-02-B           : ~86 M params, 448×448, CLIP-MIM pretraining  ← this
#   DINOv2 ViT-B/14   : ~86 M params, 518×518, self-supervised pretraining
#   ConvNeXt V2-B     : ~88 M params, 224×224, FCMAE self-supervised pretraining
# =============================================================================

experiment:
  name: "eva02_base_cv0"
  description: "EVA-02-B leave-one-year-out temporal generalization (CV0)"
  tags:
    - "eva02"
    - "eva02_base"
    - "vit"
    - "rope"
    - "clip_mim"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  name: "eva02_base"
  architecture: "eva02_base_patch14_448.mim_in22k_ft_in22k_in1k"
  pretrained: true                # Load IN-22k MIM → IN-22k → IN-1k weights
  dropout_rate: 0.3
  freeze_backbone: false          # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # 448px is the native fine-tuning resolution of this timm checkpoint.
  # EVA-02's RoPE encoding can handle other multiples of 14 (224, 336, 392,
  # 490, 518 ...), but 448 matches the pretrained weights exactly.
  image_size: [448, 448]

  # Normalization — EVA-02 pretrained with OpenAI CLIP statistics, but the
  # timm mim_in22k_ft_in22k_in1k variant normalizes with ImageNet statistics.
  # Using ImageNet mean/std is correct for this specific checkpoint.
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 16          # 448-px tiles; 16 fits 24 GB GPU at FP16 safely
    batch_size_val: 32      # Val/test can double up since no grad computation
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (identical to all other baselines for fair comparison)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision — bfloat16 is preferable for ViT-style models with SwiGLU
  # FFN, which can produce activations outside the float16 dynamic range.
  # If your GPU does not support bfloat16 (pre-Ampere), switch to float16.
  use_amp: true
  amp_dtype: "bfloat16"     # bfloat16 preferred for EVA-02 SwiGLU; fallback: float16

  # Gradient clipping — ViT attention layers benefit from conservative clipping
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates
  # EVA-02-B uses the same backbone_lr as DINOv2 ViT-B/14 to keep the
  # pretraining-objective comparison as controlled as possible.
  optimizer:
    type: "AdamW"
    backbone_lr: 2.0e-5     # Same as DINOv2 ViT-B/14 for controlled comparison
    head_lr:     2.0e-4     # 10× backbone_lr; consistent across all baselines
    weight_decay: 5.0e-2    # Consistent with ConvNeXt V2, MaxViT, ViT-B configs
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (shared across all architectures — same folds)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits"
  output_dir: "experiments/eva02_base_cv0"
