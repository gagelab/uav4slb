# =============================================================================
# ConvNeXt V2-L — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with convnextv2_cv0.yaml (ConvNeXt V2-B)
# so that the effect of CNN scaling can be isolated cleanly, and with all other
# architectures in the study for the full cross-architecture comparison.
#
# ConvNeXt V2-L vs. ConvNeXt V2-B — the key within-family comparison
# ---------------------------------------------------------------------
#   Shared              : FCMAE pretraining on ImageNet-22k, hierarchical CNN
#                         design, 4 stages, depthwise conv + GRN, 224px input
#   Stage channels      : B = [128, 256,  512, 1024]
#                         L = [192, 384,  768, 1536]
#   Feature dim         : B = 1024  →  L = 1536
#   Parameter count     : B = ~88 M →  L = ~198 M
#   backbone_lr         : B = 2e-5  →  L = 1e-5  (halved; richer hierarchy)
#   head_lr             : B = 2e-4  →  L = 1e-4  (10× ratio maintained)
#   batch_size          : B = 32    →  L = 16    (more VRAM per sample at 224px)
#
#   This is the CNN-family scaling experiment — directly analogous to the
#   DINOv2 ViT-S/14 vs. ViT-B/14 comparison on the transformer side.
#
# Key ConvNeXt V2-L-specific choices
#   architecture : convnextv2_large (timm)
#                  ~198 M params; feature dim = 1536; hierarchical CNN stages.
#   image_size   : 224  (standard ImageNet resolution; fully convolutional so
#                  any size works, but 224 matches FCMAE pretraining resolution)
#   backbone_lr  : 1e-5 (halved vs. ConvNeXt V2-B due to larger, richer CNN)
#   head_lr      : 1e-4 (10× ratio maintained from all other baselines)
#   batch_size   : 16   (224-px tiles; ~198 M params needs more VRAM per sample
#                  than ConvNeXt V2-B's 32 batch at the same resolution)
#   weight_decay : 5e-2 (ConvNeXt V2 paper recommendation; same as V2-B)
#
# Architecture comparison (all models in this study)
#   EfficientNet-V2-S  : ~21 M  params, 384×384, supervised pretraining
#   DINOv2 ViT-S/14   : ~22 M  params, 448×448, self-supervised pretraining
#   MaxViT-S           : ~69 M  params, 224×224, supervised pretraining (IN-1k)
#   EVA-02-B           : ~86 M  params, 448×448, CLIP-MIM pretraining
#   DINOv2 ViT-B/14   : ~86 M  params, 518×518, self-supervised pretraining
#   ConvNeXt V2-B     : ~88 M  params, 224×224, FCMAE self-supervised pretraining
#   ConvNeXt V2-L     : ~198 M params, 224×224, FCMAE self-supervised pretraining ← this
# =============================================================================

experiment:
  name: "convnextv2_large_cv0"
  description: "ConvNeXt V2-L leave-one-year-out temporal generalization (CV0)"
  tags:
    - "convnextv2"
    - "convnextv2_large"
    - "cnn"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  name: "convnextv2_large"
  architecture: "convnextv2_large"
  pretrained: true                # Load ImageNet-22k FCMAE weights via timm
  dropout_rate: 0.3
  freeze_backbone: false          # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".tif"

  # ConvNeXt V2 is fully convolutional; 224 matches FCMAE pretraining.
  # Upgrade to [384, 384] for higher-res crops if VRAM allows (batch_size=8).
  image_size: [224, 224]

  # Normalization — ConvNeXt V2 pretrained with ImageNet statistics (via timm)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 16          # Reduced from V2-B (32) due to larger model VRAM cost
    batch_size_val: 32      # No gradients at val/test — can double batch size
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (identical to ConvNeXt V2-B and all other baselines)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision
  use_amp: true
  amp_dtype: "float16"      # Options: "float16" | "bfloat16"

  # Gradient clipping
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates
  # ConvNeXt V2-L has a deeper and richer feature hierarchy than V2-B.
  # backbone_lr is halved (2e-5 → 1e-5) to be more conservative; the 10×
  # ratio to head_lr is preserved to keep the comparison clean.
  optimizer:
    type: "AdamW"
    backbone_lr: 1.0e-5     # Half of ConvNeXt V2-B (2e-5); richer hierarchy
    head_lr:     1.0e-4     # 10× backbone_lr; consistent ratio across all models
    weight_decay: 5.0e-2    # ConvNeXt V2 paper recommendation
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (shared across all architectures — same folds)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits"
  output_dir: "experiments/convnextv2_large_cv0"
