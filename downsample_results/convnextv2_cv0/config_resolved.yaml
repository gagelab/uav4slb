experiment:
  name: convnextv2_base_cv0_downsample
  description: ConvNeXt V2-B leave-one-year-out temporal generalization (CV0)
  tags:
  - convnextv2
  - convnextv2_base
  - cnn
  - cv0
  - regression
  - slb
model:
  name: convnextv2_base
  architecture: convnextv2_base
  pretrained: true
  dropout_rate: 0.3
  freeze_backbone: false
data:
  image_dir: /mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced
  labels_csv: /mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv
  image_filename_column: image_filename
  target_column: score
  year_column: year
  image_extension: .jpg
  image_size:
  - 224
  - 224
  normalize:
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
  dataloader:
    batch_size: 32
    batch_size_val: 64
    num_workers: 4
    pin_memory: true
  splits:
    random_seed: 42
    stratify: true
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit:
      - 3
      - 5
      p: 0.2
    gaussian_noise:
      enabled: false
  val:
    enabled: false
training:
  max_epochs: 60
  seed: 42
  use_amp: true
  amp_dtype: float16
  gradient_clip: 1.0
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: val_r2
    mode: max
  optimizer:
    type: AdamW
    backbone_lr: 2.0e-05
    head_lr: 0.0002
    weight_decay: 0.05
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    type: cosine_with_warmup
    warmup_epochs: 5
    T_max: 55
    min_lr: 1.0e-07
  loss:
    type: mse
checkpoint:
  save_best: true
  monitor: val_r2
  mode: max
  save_last: true
logging:
  log_interval: 10
  tensorboard: true
cv:
  type: cv0
  n_folds: 3
  splits_dir: data/cv_splits/cv0_downsampled
  output_dir: /mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/downsample_results/convnextv2_cv0
