# =============================================================================
# DINOv2 ViT-B/14 — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with all other architectures in this
# study, particularly dinov2_vits14_cv0.yaml (DINOv2 ViT-S/14), which shares
# the same self-supervised pretraining objective and macro-architecture but
# differs in model scale and input resolution — the cleanest DINOv2 scaling
# comparison — and eva02_base_cv0.yaml (EVA-02-B), which shares backbone size
# and patch size but differs in pretraining objective and positional encoding.
#
# Key DINOv2 ViT-B/14-specific choices
#   architecture : dinov2_vitb14 (torch.hub / timm)
#                  ~86 M params; feature dim = 768; patch size 14.
#   image_size   : 518  (= 14 × 37 patches — DINOv2's recommended resolution)
#                  Use 224 if GPU memory is tight (still divisible by 14).
#   backbone_lr  : 3e-5 (10× lower than head to preserve pretrained features)
#   head_lr      : 3e-4
#   warmup       : 5 epochs linear warm-up followed by cosine decay
#   batch_size   : 16   (518-px tiles are ~3× larger than 224-px; adjust if OOM)
#   amp          : true (bfloat16 recommended for A100/H100, float16 otherwise)
#   weight_decay : 5e-2 (consistent with all other models in this study)
#
# Architecture comparison (all models in this study)
#   EfficientNet-V2-S  : ~21 M  params, 384×384, supervised pretraining
#   DINOv2 ViT-S/14   : ~22 M  params, 448×448, self-supervised pretraining
#   MaxViT-S           : ~69 M  params, 224×224, supervised (IN-1k)
#   CoAtNet-2          : ~75 M  params, 224×224, supervised (IN-12k → IN-1k)
#   EVA-02-B           : ~86 M  params, 448×448, CLIP-MIM pretraining
#   DINOv2 ViT-B/14   : ~86 M  params, 518×518, self-supervised pretraining ← this
#   ConvNeXt V2-B     : ~88 M  params, 224×224, FCMAE self-supervised pretraining
#   SwinV2-B           : ~88 M  params, 256×256, supervised (IN-22k → IN-1k)
#   ConvNeXt V2-L     : ~198 M params, 224×224, FCMAE self-supervised pretraining
# =============================================================================

experiment:
  name: "dinov2_vitb14_cv0_downsample"
  description: "DINOv2 ViT-B/14 leave-one-year-out temporal generalization (CV0)"
  tags:
    - "dinov2"
    - "vitb14"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  name: "dinov2_vitb14"
  architecture: "dinov2_vitb14"
  pretrained: true
  dropout_rate: 0.3
  freeze_backbone: false   # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # DINOv2 native patch size is 14; 518 = 14×37 gives optimal resolution.
  # Drop to 224 = 14×16 to halve GPU memory usage.
  image_size: [518, 518]

  # Normalization — DINOv2 was trained with ImageNet statistics
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 16          # 518-px; increase to 32 if using 224-px or A100
    batch_size_val: 32
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (same conservative strategy as EfficientNet baseline)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision — use bfloat16 on Ampere+ (A100/H100), float16 otherwise
  use_amp: true
  amp_dtype: "float16"      # Options: "float16" | "bfloat16"

  # Gradient clipping prevents exploding gradients in deep ViT layers
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates: backbone gets 10× lower LR
  optimizer:
    type: "AdamW"
    backbone_lr: 3.0e-5
    head_lr:     3.0e-4
    weight_decay: 5.0e-2
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5        # Linear warm-up before cosine decay
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"             # Huber loss is an alternative: type: "huber", delta: 1.0

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10          # Log every N batches
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (generated by scripts/create_cv_splits.py)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits/cv0_downsampled"
  output_dir: "experiments/dinov2_vitb14_cv0_downsample"
