# =============================================================================
# ConvNeXt V2-B — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with dinov2_cv0.yaml (ViT-B/14) and
# dinov2_cv0_vits14.yaml (ViT-S/14) so results can be meaningfully contrasted
# across CNN vs. transformer architectures.
#
# Key ConvNeXt V2-B-specific choices
#   architecture : convnextv2_base (timm)
#                  88 M params; feature dim = 1024; hierarchical CNN stages.
#   image_size   : 224  (standard ImageNet resolution; ConvNeXt V2 is fully
#                  convolutional so any size works, but 224 matches pretraining)
#                  Use 384 for higher-res crops if VRAM allows (batch_size=16).
#   backbone_lr  : 2e-5 (lower than DINOv2 ViT-S due to larger CNN model and
#                  richer low-level feature hierarchy to preserve)
#   head_lr      : 2e-4 (10× ratio maintained for clean comparison)
#   batch_size   : 32   (224-px tiles at FP16 fits comfortably on 24 GB GPU)
#   weight_decay : 5e-2 (ConvNeXt V2 uses higher WD per original paper)
#
# Architecture comparison
#   EfficientNet-V2-S  : ~21 M params, 384×384, supervised pretraining
#   DINOv2 ViT-B/14   : ~86 M params, 518×518, self-supervised pretraining
#   DINOv2 ViT-S/14   : ~22 M params, 448×448, self-supervised pretraining
#   ConvNeXt V2-B     : ~88 M params, 224×224, FCMAE self-supervised pretraining
#
# ConvNeXt V2-B is the CNN counterpart to ViT-B/14 — similar parameter count,
# similar self-supervised pretraining origin — enabling a clean CNN vs.
# transformer comparison on the SLB disease severity regression task.
# =============================================================================

experiment:
  name: "convnextv2_base_cv0_downsample"
  description: "ConvNeXt V2-B leave-one-year-out temporal generalization (CV0)"
  tags:
    - "convnextv2"
    - "convnextv2_base"
    - "cnn"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model: 
  name: "convnextv2_base"
  architecture: "convnextv2_base"
  pretrained: true                # Load ImageNet-22k FCMAE weights via timm
  dropout_rate: 0.3
  freeze_backbone: false          # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # ConvNeXt V2 is fully convolutional; 224 matches ImageNet pretraining.
  # Upgrade to [384, 384] for higher-resolution tiles if VRAM allows.
  image_size: [224, 224]

  # Normalization — ConvNeXt V2 pretrained with ImageNet statistics (via timm)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 32          # 224-px; fits 24 GB GPU at FP16 comfortably
    batch_size_val: 64
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (identical to DINOv2 baseline for fair comparison)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision
  use_amp: true
  amp_dtype: "float16"      # Options: "float16" | "bfloat16"

  # Gradient clipping
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates
  # ConvNeXt V2-B has richer low-level features worth preserving → lower
  # backbone LR than ViT-S/14. 10× ratio maintained from ViT baselines.
  optimizer:
    type: "AdamW"
    backbone_lr: 2.0e-5     # Lower than ViT-S (5e-5) due to larger CNN depth
    head_lr:     2.0e-4
    weight_decay: 5.0e-2    # ConvNeXt V2 paper uses 0.05; higher than ViT configs
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (shared across all architectures — same folds)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits/cv0_downsampled"
  output_dir: "experiments/convnextv2_base_cv0_downsample"
