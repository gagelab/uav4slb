# =============================================================================
# eva02_base_retrain.yaml
# EVA-02-B — Warm-Start Retraining on Expanded Dataset
# =============================================================================
# This config is used exclusively with --warm-start, not for original CV0
# training.  It initialises from the best checkpoint of the original
# eva02_base_cv0 run and retrains on an expanded dataset (new field season
# appended to full_dataset.csv).
#
# Key differences from eva02_base_cv0.yaml
# ─────────────────────────────────────────
#   backbone_lr : 2e-5  →  1e-5   (halved — backbone already adapted to domain)
#   head_lr     : 2e-4  →  1e-4   (halved — 10× ratio maintained)
#   warmup_epochs: 5    →  3      (shorter — optimizer already conceptually warm)
#   max_epochs  : 60    →  40     (fewer needed from a warm start)
#   output_dir  : eva02_base_cv0  →  eva02_base_retrain
#
# Why lower learning rates for warm-start retraining?
# ────────────────────────────────────────────────────
# After the original training run the backbone weights are already adapted to
# the UAV + SLB domain.  Using the same learning rates as the original run
# risks overwriting features learned from earlier seasons.  Halving the LRs
# makes smaller gradient steps that nudge the weights toward a joint optimum
# for all seasons rather than aggressively fitting the new data.
#
# The 10× backbone/head ratio is preserved throughout to ensure consistent
# regularisation of the pretrained features relative to task-specific layers.
#
# Workflow
# ────────
#   1. Append new season rows to data/labels/full_dataset.csv (update symlink)
#   2. Regenerate ALL CV0 splits from scratch:
#        python scripts/create_cv_splits.py \
#            --labels-csv data/labels/full_dataset.csv \
#            --output-dir data/cv_splits
#   3. Run warm-start retraining for all three folds:
#        bash scripts/run_train_cv0.sh \
#            --config configs/eva02_base_retrain.yaml \
#            --warm-start results/eva02_base_cv0/checkpoints/fold_2025/checkpoint_best.pt
#      Or target a single fold:
#        python scripts/train_cv0.py \
#            --config configs/eva02_base_retrain.yaml \
#            --warm-start results/eva02_base_cv0/checkpoints/fold_2025/checkpoint_best.pt \
#            --fold fold_2025
#
# Note on --fold and --warm-start
# ────────────────────────────────
# When running all three folds with --warm-start, each fold inherits the same
# source checkpoint weights (the best model from the original run on the full
# dataset).  This is the correct behaviour: the source checkpoint is a
# domain-adapted weight initialisation, not a fold-specific model.  Each fold
# then fine-tunes from this common starting point on its own expanded training
# split.
# =============================================================================

experiment:
  name: "eva02_base_retrain"
  description: >
    EVA-02-B warm-start retraining on expanded dataset (new field season).
    Weights initialised from best checkpoint of eva02_base_cv0 run.
    Lower learning rates used to preserve earlier-season representations.
  tags:
    - "eva02"
    - "eva02_base"
    - "warm_start"
    - "retrain"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model — identical to eva02_base_cv0.yaml
# pretrained=true is required so the model class loads the timm architecture
# definition, but the actual weights come from the --warm-start checkpoint.
# -----------------------------------------------------------------------------
model:
  name: "eva02_base"
  architecture: "eva02_base_patch14_448.mim_in22k_ft_in22k_in1k"
  pretrained: true
  dropout_rate: 0.3
  freeze_backbone: false

# -----------------------------------------------------------------------------
# Data — update labels_csv path when a new season is appended
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # Native EVA-02-B fine-tuning resolution — unchanged from original run
  image_size: [448, 448]

  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 16
    batch_size_val: 32
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation — identical to original run for comparability
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false
  val:
    enabled: false

# -----------------------------------------------------------------------------
# Training — reduced LRs and shorter schedule for warm-start
# -----------------------------------------------------------------------------
training:
  max_epochs: 40          # Fewer epochs needed from a domain-adapted init.
                          # Monitor val R² — early stopping will fire sooner
                          # if the model converges quickly.
  seed: 42

  use_amp: true
  amp_dtype: "bfloat16"

  gradient_clip: 1.0

  early_stopping:
    enabled: true
    patience: 10          # Reduced from 12 — convergence is faster from warm start
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  optimizer:
    type: "AdamW"
    # Reduced learning rates for warm-start retraining.
    # Rationale: backbone weights are already adapted to the UAV + SLB domain
    # after the original training run.  Large gradient steps risk overwriting
    # representations learned from earlier seasons.  Using half the original
    # LRs makes smaller corrections while the new data adjusts the weights.
    # The 10× backbone/head ratio is preserved for consistent regularisation.
    backbone_lr: 1.0e-5   # Half of original (2e-5) — preserve domain features
    head_lr:     1.0e-4   # Half of original (2e-4) — 10× ratio maintained
    weight_decay: 5.0e-2  # Unchanged — same regularisation strength
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 3      # Shorter warmup (was 5) — optimizer starts from a
                          # better region and needs less ramp-up time.
    T_max: 37             # max_epochs - warmup_epochs = 40 - 3
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits — uses the same splits structure, regenerated with expanded data
# output_dir is separate so results are not mixed with the original cv0 run
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits"
  output_dir: "results/eva02_base_retrain"
