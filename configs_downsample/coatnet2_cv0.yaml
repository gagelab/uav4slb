# =============================================================================
# CoAtNet-2 — CV0 Leave-One-Year-Out Configuration
# =============================================================================
# Structured to be directly comparable with all other architectures in this
# study.  CoAtNet-2 is the second hybrid CNN+Transformer baseline after
# MaxViT-S, but uses a staged rather than interleaved mixing strategy —
# making the CoAtNet-2 vs. MaxViT-S comparison a controlled experiment on
# hybrid architecture design.
#
# CoAtNet-2 hybrid design
# -----------------------
#   Stage 0 : Conv stem (2×, stride 2) — low-level features
#   Stage 1 : MBConv (stride 2) — local texture, depthwise conv + SE
#   Stage 2 : MBConv (stride 2) — mid-level features
#   Stage 3 : Transformer (stride 2, global relative attention) — semantics
#   Stage 4 : Transformer (stride 2, global relative attention) — context
#   Pool    : Global average pool → 1024-dim feature vector
#
#   The design principle: convolution is more data-efficient for early-layer
#   feature extraction; attention generalises better for semantic abstraction.
#   For SLB prediction this maps naturally to lesion texture (conv stages) vs.
#   plot-level disease progression (attention stages).
#
# Key comparisons enabled by CoAtNet-2
# --------------------------------------
#   CoAtNet-2 vs. MaxViT-S  — staged (CoAtNet) vs. interleaved (MaxViT)
#                              CNN+Transformer at ~69–75 M params, both 224px
#   CoAtNet-2 vs. SwinV2-B  — global attention (CoAtNet S3/S4) vs.
#                              local shifted-window attention (SwinV2)
#   CoAtNet-2 vs. ConvNeXt V2-B — staged hybrid vs. pure CNN at similar scale
#
# Key CoAtNet-2-specific choices
#   architecture : coatnet_2_rw_224.sw_in12k_ft_in1k (timm)
#                  ~75 M params; feature dim = 1024; 224×224 input.
#                  "rw" = Ross Wightman's timm re-implementation.
#                  Pretrained on ImageNet-12k (sw = SameWhitening augmentation),
#                  fine-tuned on ImageNet-1k at 224px.
#   image_size   : 224  — native fine-tuning resolution.
#                  CoAtNet's relative position bias can generalise to larger
#                  inputs (multiples of 32), but 224 matches the checkpoint.
#                  Valid alternatives: 256, 288, 320, 384.
#   backbone_lr  : 2e-5 (matched to MaxViT-S for clean hybrid comparison)
#   head_lr      : 2e-4 (10× ratio maintained across all baselines)
#   batch_size   : 32   (224-px tiles at FP16 fits comfortably on 24 GB GPU)
#   weight_decay : 5e-2 (consistent with all other models in this study)
#
# Architecture comparison (all models in this study)
#   EfficientNet-V2-S  : ~21 M  params, 384×384, supervised pretraining
#   DINOv2 ViT-S/14   : ~22 M  params, 448×448, self-supervised pretraining
#   MaxViT-S           : ~69 M  params, 224×224, supervised (IN-1k)
#   CoAtNet-2          : ~75 M  params, 224×224, supervised (IN-12k → IN-1k) ← this
#   EVA-02-B           : ~86 M  params, 448×448, CLIP-MIM pretraining
#   DINOv2 ViT-B/14   : ~86 M  params, 518×518, self-supervised pretraining
#   ConvNeXt V2-B     : ~88 M  params, 224×224, FCMAE self-supervised pretraining
#   SwinV2-B           : ~88 M  params, 256×256, supervised (IN-22k → IN-1k)
#   ConvNeXt V2-L     : ~198 M params, 224×224, FCMAE self-supervised pretraining
# =============================================================================

experiment:
  name: "coatnet2_cv0_downsample"
  description: "CoAtNet-2 leave-one-year-out temporal generalization (CV0)"
  tags:
    - "coatnet"
    - "coatnet2"
    - "hybrid"
    - "staged_cnn_transformer"
    - "cv0"
    - "regression"
    - "slb"

# -----------------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------------
model:
  name: "coatnet2"
  architecture: "coatnet_2_rw_224.sw_in12k_ft_in1k"
  pretrained: true                # Load IN-12k sw → IN-1k pretrained weights
  dropout_rate: 0.3
  freeze_backbone: false          # Set true for quick linear-probe baseline

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
data:
  image_dir: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/final_image/final_sliced"
  labels_csv: "/mnt/research-projects/j/jlgage/RawUAVData01/uavforslb/uav4slb/data/labels/full_dataset.csv"

  image_filename_column: "image_filename"
  target_column: "score"
  year_column: "year"
  image_extension: ".jpg"

  # 224×224 is the native fine-tuning resolution for this checkpoint.
  # CoAtNet's relative position bias interpolates to other sizes, but inputs
  # must be multiples of 32 (5× stride-2 operations through the network).
  # Valid alternatives: 256, 288, 320, 384 (reduce batch size accordingly).
  image_size: [224, 224]

  # Normalization — CoAtNet pretrained with ImageNet statistics (via timm)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

  dataloader:
    batch_size: 32          # 224-px; fits 24 GB GPU at FP16 comfortably
    batch_size_val: 64      # No grad at val/test — can double up
    num_workers: 4
    pin_memory: true

  splits:
    random_seed: 42
    stratify: true

# -----------------------------------------------------------------------------
# Augmentation  (identical to all other baselines for fair comparison)
# -----------------------------------------------------------------------------
augmentation:
  train:
    enabled: true
    horizontal_flip:
      enabled: true
      p: 0.5
    vertical_flip:
      enabled: true
      p: 0.5
    rotation:
      enabled: true
      limit: 30
      p: 0.33
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.33
    gaussian_blur:
      enabled: true
      blur_limit: [3, 5]
      p: 0.2
    gaussian_noise:
      enabled: false        # Disabled — noise can mask subtle lesion texture
  val:
    enabled: false          # No augmentation at inference time

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  max_epochs: 60
  seed: 42

  # Mixed precision — float16 is safe for CoAtNet (standard GELU FFN; no SwiGLU)
  use_amp: true
  amp_dtype: "bfloat16"      # Options: "float16" | "bfloat16"

  # Gradient clipping — important for the Transformer stages (S3/S4) which
  # can produce large attention gradients early in fine-tuning
  gradient_clip: 1.0

  # Early stopping on val R²
  early_stopping:
    enabled: true
    patience: 12
    min_delta: 0.001
    monitor: "val_r2"
    mode: "max"

  # Differential learning rates
  # backbone_lr=2e-5 matches MaxViT-S for the cleanest hybrid comparison.
  # The 10× ratio to head_lr is maintained throughout all baselines.
  optimizer:
    type: "AdamW"
    backbone_lr: 2.0e-5     # Same as MaxViT-S for clean hybrid comparison
    head_lr:     2.0e-4     # 10× backbone_lr; consistent across all baselines
    weight_decay: 5.0e-2    # Consistent with all other models in this study
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: "cosine_with_warmup"
    warmup_epochs: 5
    T_max: 55               # max_epochs - warmup_epochs
    min_lr: 1.0e-7

  loss:
    type: "mse"

# -----------------------------------------------------------------------------
# Checkpointing & logging
# -----------------------------------------------------------------------------
checkpoint:
  save_best: true
  monitor: "val_r2"
  mode: "max"
  save_last: true

logging:
  log_interval: 10
  tensorboard: true

# -----------------------------------------------------------------------------
# CV splits location  (shared across all architectures — same folds)
# -----------------------------------------------------------------------------
cv:
  type: "cv0"
  n_folds: 3
  splits_dir: "data/cv_splits/cv0_downsampled"
  output_dir: "experiments/coatnet2_cv0_downsample"
